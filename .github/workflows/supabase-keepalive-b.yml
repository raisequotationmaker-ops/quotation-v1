# Keepalive B — evening ping (18:00 IST / 12:30 UTC). Retries on failure.
# If this workflow fails, Keepalive C is triggered.
name: Supabase Keepalive B

on:
  schedule:
    # 18:00 IST = 12:30 UTC
    - cron: "30 12 * * *"
  workflow_dispatch:

concurrency:
  group: supabase-keepalive-b
  cancel-in-progress: false

jobs:
  ping:
    name: Ping B
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add repository secrets SUPABASE_URL and SUPABASE_ANON_KEY"
            exit 1
          fi

      - name: Ping Supabase (B)
        uses: ./.github/actions/ping-supabase
        with:
          supabase_url: ${{ secrets.SUPABASE_URL }}
          supabase_anon_key: ${{ secrets.SUPABASE_ANON_KEY }}
          attempts: "3"
          delay_seconds: "25"
          label: "B"
