# Keepalive C — failover only.
# Runs when Keepalive A OR Keepalive B fails.
name: Supabase Keepalive C

on:
  workflow_run:
    workflows:
      - Supabase Keepalive A
      - Supabase Keepalive B
    types: [completed]
  workflow_dispatch:

concurrency:
  group: supabase-keepalive-c
  cancel-in-progress: false

jobs:
  ping:
    name: Ping C
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only when A or B failed. Manual dispatch always allowed.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log trigger
        run: |
          echo "event=${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "failed_workflow=${{ github.event.workflow_run.name }}"
            echo "conclusion=${{ github.event.workflow_run.conclusion }}"
            echo "run_id=${{ github.event.workflow_run.id }}"
          fi

      - name: Require secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add repository secrets SUPABASE_URL and SUPABASE_ANON_KEY"
            exit 1
          fi

      - name: Ping Supabase (C)
        uses: ./.github/actions/ping-supabase
        with:
          supabase_url: ${{ secrets.SUPABASE_URL }}
          supabase_anon_key: ${{ secrets.SUPABASE_ANON_KEY }}
          attempts: "4"
          delay_seconds: "30"
          label: "C"
